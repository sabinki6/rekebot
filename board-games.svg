<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B16" />
      <stop offset="50%" stop-color="#120E29" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>

    <radialGradient id="ambientPurple" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090B16" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="d20Grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="d20Grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="d20Grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="hexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonBoard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgBoard)" />
  <rect width="800" height="500" fill="url(#ambientPurple)" />

  <!-- Isometric Board Grid / Hexagonal Playing Surface -->
  <g transform="translate(400, 310) scale(1, 0.58)" opacity="0.85">
    <!-- Outer Board Plinth -->
    <polygon points="0,-160 320,0 0,160 -320,0" fill="#0A0F24" stroke="#8B5CF6" stroke-width="3" filter="url(#neonBoard)" />
    <polygon points="0,-150 300,0 0,150 -300,0" fill="#111836" stroke="#00E5FF" stroke-width="1.5" />

    <!-- Hexagonal Grid Tiles -->
    <g stroke="#00E5FF" stroke-width="1.5" fill="url(#hexGlow)">
      <!-- Center Hex -->
      <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18" />
      
      <!-- Ring 1 -->
      <polygon points="0,-95 30,-78 30,-42 0,-25 -30,-42 -30,-78" />
      <polygon points="52,-65 82,-48 82,-12 52,5 22,-12 22,-48" fill="#8B5CF6" fill-opacity="0.3" stroke="#A855F7" />
      <polygon points="52,25 82,42 82,78 52,95 22,78 22,42" />
      <polygon points="0,65 30,82 30,118 0,135 -30,118 -30,82" fill="#F59E0B" fill-opacity="0.25" stroke="#FCD34D" />
      <polygon points="-52,25 -22,42 -22,78 -52,95 -82,78 -82,42" />
      <polygon points="-52,-65 -22,-48 -22,-12 -52,5 -82,-12 -82,-48" fill="#8B5CF6" fill-opacity="0.3" stroke="#A855F7" />

      <!-- Outer Strategy Paths -->
      <polygon points="104,-35 134,-18 134,18 104,35 74,18 74,-18" />
      <polygon points="-104,-35 -74,-18 -74,18 -104,35 -134,18 -134,-18" />
      <polygon points="104,55 134,72 134,108 104,125 74,108 74,72" />
      <polygon points="-104,55 -74,72 -74,108 -104,125 -134,108 -134,72" />
      <polygon points="156,25 186,42 186,78 156,95 126,78 126,42" fill="#00E5FF" fill-opacity="0.3" />
      <polygon points="-156,25 -126,42 -126,78 -156,95 -186,78 -186,42" fill="#00E5FF" fill-opacity="0.3" />
    </g>

    <!-- Strategy Path Energy Lines -->
    <path d="M-156,25 L-104,-35 L0,-35 L104,-35 L156,25" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#goldGlow)" />
  </g>

  <!-- Left: Fanned Out Holographic Playing Cards -->
  <g transform="translate(190, 200)" filter="url(#neonBoard)">
    <!-- Card 1 (Back left) -->
    <g transform="rotate(-18) translate(-35, -20)">
      <rect x="-45" y="-70" width="90" height="140" rx="10" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="2" />
      <rect x="-37" y="-62" width="74" height="124" rx="6" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#8B5CF6" stroke-width="1.5" />
    </g>

    <!-- Card 2 (Middle) -->
    <g transform="rotate(-4)">
      <rect x="-48" y="-75" width="96" height="150" rx="10" fill="#141133" stroke="#3B82F6" stroke-width="2" />
      <rect x="-40" y="-67" width="80" height="134" rx="6" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.5" />
      <polygon points="0,-25 18,5 0,35 -18,5" fill="none" stroke="#00E5FF" stroke-width="2" />
      <circle cx="0" cy="5" r="7" fill="#00E5FF" />
    </g>

    <!-- Card 3 (Hero Front Card) -->
    <g transform="rotate(12) translate(35, 10)">
      <rect x="-50" y="-80" width="100" height="160" rx="12" fill="#17123B" stroke="#00E5FF" stroke-width="2.5" />
      <rect x="-42" y="-72" width="84" height="144" rx="8" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.6" />
      <!-- Card Artwork / Creature Rune -->
      <circle cx="0" cy="-20" r="22" fill="#0E122A" stroke="url(#goldGrad)" stroke-width="2" />
      <polygon points="0,-35 12,-16 0,0 -12,-16" fill="url(#goldGrad)" filter="url(#goldGlow)" />
      <!-- Card Stats & Attack Lines -->
      <line x1="-30" y1="18" x2="30" y2="18" stroke="#8B5CF6" stroke-width="2" />
      <line x1="-30" y1="28" x2="15" y2="28" stroke="#8B5CF6" stroke-width="2" opacity="0.7" />
      <circle cx="-25" cy="48" r="8" fill="#F59E0B" />
      <text x="-25" y="52" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">★</text>
      <circle cx="25" cy="48" r="8" fill="#00E5FF" />
      <text x="25" y="52" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#000" text-anchor="middle">9</text>
    </g>
  </g>

  <!-- Center-Right: Iconic 3D Glowing D20 (20-Sided Tabletop Die) -->
  <g transform="translate(460, 160)" filter="url(#neonBoard)">
    <!-- Base D20 Facets -->
    <!-- Top Triangle (Hero facet facing camera) -->
    <polygon points="0,-75 -65,30 65,30" fill="url(#d20Grad2)" stroke="#00E5FF" stroke-width="2" />
    <text x="0" y="-2" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#goldGlow)">20</text>

    <!-- Surrounding Facets -->
    <polygon points="0,-75 65,30 115,-30" fill="url(#d20Grad1)" stroke="#00E5FF" stroke-width="2" />
    <polygon points="0,-75 115,-30 65,-95" fill="url(#d20Grad3)" stroke="#8B5CF6" stroke-width="2" />
    <polygon points="0,-75 65,-95 -65,-95" fill="url(#d20Grad1)" stroke="#8B5CF6" stroke-width="2" />
    <polygon points="0,-75 -65,-95 -115,-30" fill="url(#d20Grad3)" stroke="#8B5CF6" stroke-width="2" />
    <polygon points="0,-75 -115,-30 -65,30" fill="url(#d20Grad1)" stroke="#00E5FF" stroke-width="2" />

    <!-- Bottom Facets -->
    <polygon points="-65,30 0,95 65,30" fill="url(#d20Grad3)" stroke="#00E5FF" stroke-width="2" />
    <polygon points="-65,30 -115,-30 -90,70 0,95" fill="url(#d20Grad1)" stroke="#8B5CF6" stroke-width="2" opacity="0.9" />
    <polygon points="65,30 115,-30 90,70 0,95" fill="url(#d20Grad2)" stroke="#8B5CF6" stroke-width="2" opacity="0.9" />

    <!-- Edge Highlight Pips / Runes -->
    <circle cx="0" cy="-75" r="4" fill="#00E5FF" />
    <circle cx="-65" cy="30" r="4" fill="#00E5FF" />
    <circle cx="65" cy="30" r="4" fill="#00E5FF" />
    <circle cx="0" cy="95" r="4" fill="#00E5FF" />
  </g>

  <!-- Right: Companion Tumbling 6-Sided Die (D6) -->
  <g transform="translate(620, 240) rotate(-22)" filter="url(#neonBoard)">
    <!-- Isometric Cube Faces -->
    <!-- Top Face (Showing 3 pips) -->
    <polygon points="0,-40 40,-20 0,0 -40,-20" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="-20" cy="-25" r="3.5" fill="#090B16" />
    <circle cx="0" cy="-20" r="3.5" fill="#090B16" />
    <circle cx="20" cy="-15" r="3.5" fill="#090B16" />

    <!-- Left Face (Showing 5 pips) -->
    <polygon points="-40,-20 0,0 0,45 -40,25" fill="#0088CC" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="-28" cy="-5" r="3.5" fill="#FFFFFF" />
    <circle cx="-12" cy="3" r="3.5" fill="#FFFFFF" />
    <circle cx="-20" cy="12" r="3.5" fill="#FFFFFF" />
    <circle cx="-28" cy="21" r="3.5" fill="#FFFFFF" />
    <circle cx="-12" cy="29" r="3.5" fill="#FFFFFF" />

    <!-- Right Face (Showing 6 pips) -->
    <polygon points="0,0 40,-20 40,25 0,45" fill="#006699" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="12" cy="5" r="3.5" fill="#FFFFFF" />
    <circle cx="28" cy="-3" r="3.5" fill="#FFFFFF" />
    <circle cx="12" cy="19" r="3.5" fill="#FFFFFF" />
    <circle cx="28" cy="11" r="3.5" fill="#FFFFFF" />
    <circle cx="12" cy="33" r="3.5" fill="#FFFFFF" />
    <circle cx="28" cy="25" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Center Strategy Player Meeple / Figurine (Standing proud on board) -->
  <g transform="translate(370, 260)" filter="url(#neonBoard)">
    <!-- Meeple Silhouette in Gold -->
    <path d="M0,-30 C-6,-30 -10,-26 -10,-20 C-10,-16 -7,-13 -4,-11 C-12,-9 -18,-2 -25,5 C-28,9 -26,14 -20,13 C-15,12 -12,8 -10,6 L-10,25 C-10,27 -6,28 0,28 C6,28 10,27 10,25 L10,6 C12,8 15,12 20,13 C26,14 28,9 25,5 C18,-2 12,-9 4,-11 C7,-13 10,-16 10,-20 C10,-26 6,-30 0,-30 Z" 
          fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#goldGlow)" />
    <!-- Pedestal ring under meeple -->
    <ellipse cx="0" cy="28" rx="22" ry="7" fill="none" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- Rolling Particle Dust & Magic Sparkles -->
  <g fill="#FCD34D" opacity="0.8">
    <circle cx="330" cy="170" r="3" />
    <circle cx="580" cy="110" r="2.5" />
    <circle cx="410" cy="90" r="3.5" />
    <circle cx="530" cy="270" r="2" />
    <circle cx="250" cy="100" r="2" />
    <circle cx="670" cy="200" r="3" />
  </g>

  <!-- High-tech Banner Frame -->
  <g transform="translate(400, 445)">
    <rect x="-160" y="-18" width="320" height="34" rx="17" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="5" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="800" fill="#C084FC" letter-spacing="3" text-anchor="middle">
      BOARD GAMES &amp; TABLETOP
    </text>
  </g>

  <!-- Corner Tech HUD Accents -->
  <path d="M30,30 L60,30 M30,30 L30,60" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="30" cy="30" r="3" fill="#8B5CF6" />
  <path d="M770,30 L740,30 M770,30 L770,60" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="770" cy="30" r="3" fill="#8B5CF6" />
  <path d="M30,470 L60,470 M30,470 L30,440" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="30" cy="470" r="3" fill="#8B5CF6" />
  <path d="M770,470 L740,470 M770,470 L770,440" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="770" cy="470" r="3" fill="#8B5CF6" />
</svg>